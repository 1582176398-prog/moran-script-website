<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Music</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif;
  background:#F6F6F6; color:#111; -webkit-font-smoothing:antialiased;
}

/* ===== 歌单列表页 ===== */
#playlist-view {
  height:100vh; display:flex; flex-direction:column; background:#F6F6F6;
}
.pl-header {
  padding:24px 20px 16px; flex-shrink:0;
  display:flex; flex-direction:column; align-items:center;
}
.pl-header-title {
  font-size:32px; font-weight:600;
  letter-spacing:-1px; color:#111;
}
.pl-header-subtitle {
  font-size:13px; color:#999; margin-top:4px;
}
.pl-grid {
  flex:1; overflow-y:auto;
  display:grid; grid-template-columns:repeat(2,1fr); gap:28px;
  align-content:start; -webkit-overflow-scrolling:touch;
  padding:0 20px 80px;
}
.pl-grid::-webkit-scrollbar { display:none; }
.pl-card {
  aspect-ratio:1; overflow:hidden;
  cursor:pointer; background:#DDD;
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
}
.pl-card:active { transform:scale(0.95); }
.pl-card img { width:100%; height:100%; object-fit:contain; display:block; }

/* ===== 播放器页 ===== */
#player-view {
  position:fixed; top:0; left:0; right:0; bottom:0;
  display:none; flex-direction:column; background:#222; z-index:10;
}
#player-view.show { display:flex; }
#player-view .pl-bg {
  position:absolute; top:0; left:0; right:0; bottom:0;
  background-size:cover; background-position:center;
  filter:brightness(0.5) blur(30px) saturate(1.2);
  transform:scale(1.15); z-index:0; pointer-events:none;
}
.pv-body {
  position:relative; z-index:1;
  display:flex; flex-direction:column; height:100%; color:#FFF;
}

/* 顶部栏 */
.player-header {
  display:flex; align-items:center; padding:12px 16px; flex-shrink:0;
}
.back-btn {
  background:none; border:none; padding:8px; cursor:pointer;
  color:#FFF; display:flex; align-items:center;
  -webkit-tap-highlight-color:transparent;
}
.back-btn svg { width:22px; height:22px; }
.player-header-title {
  flex:1; text-align:center; font-size:15px; font-weight:500;
  margin-right:38px; color:#FFF;
}

/* 封面圆图 */
.cover-area {
  flex-shrink:0; display:flex; justify-content:center;
  padding:16px 0 4px;
}
.cover-circle-placeholder {
  width:200px; height:200px; border-radius:50%;
  background:#E0E0E0; display:flex; align-items:center; justify-content:center;
  color:#AAA; font-size:14px;
}
.cover-circle {
  width:200px; height:200px; border-radius:50%; overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,0.25);
  position:relative; background:#E0E0E0;
}
.cover-circle img {
  width:100%; height:100%; object-fit:contain; display:block;
  animation:spin 8s linear infinite; animation-play-state:paused;
}
.cover-circle.spinning img { animation-play-state:running; }
@keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
.cover-overlay {
  position:absolute; left:0; right:0; bottom:0;
  padding:28px 14px 18px;
  background:linear-gradient(transparent, rgba(0,0,0,0.55));
  border-radius:0 0 50% 50% / 0 0 50% 50%;
  text-align:center; pointer-events:none;
}
.cover-song-title {
  font-size:15px; font-weight:600; color:#FFF;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.cover-song-artist { font-size:12px; color:rgba(255,255,255,0.65); margin-top:2px; }

/* 进度条 */
.progress-area { width:100%; padding:16px 28px 4px; flex-shrink:0; }
.progress-track {
  width:100%; height:20px; display:flex; align-items:center;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.progress-bg {
  width:100%; height:3px; background:rgba(255,255,255,0.2);
  border-radius:2px; position:relative;
}
.progress-fill {
  height:100%; background:#FFF; border-radius:2px; width:0%;
  position:relative; transition:width 0.05s linear;
}
.progress-dot {
  width:12px; height:12px; border-radius:50%; background:#FFF;
  position:absolute; right:-6px; top:50%; transform:translateY(-50%);
  opacity:0; transition:opacity 0.15s;
}
.progress-track:hover .progress-dot,
.progress-track.dragging .progress-dot { opacity:1; }
.time-row {
  display:flex; justify-content:space-between;
  font-size:11px; color:rgba(255,255,255,0.45); margin-top:5px;
  font-variant-numeric:tabular-nums;
}

/* 控制按钮 */
.controls {
  display:flex; align-items:center; justify-content:center;
  gap:36px; padding:8px 28px 4px; flex-shrink:0;
}
.ctrl-btn {
  background:none; border:none; cursor:pointer;
  color:rgba(255,255,255,0.75);
  display:flex; align-items:center; justify-content:center;
  padding:8px; -webkit-tap-highlight-color:transparent;
}
.ctrl-btn svg { width:22px; height:22px; }
.play-btn {
  width:56px; height:56px; border-radius:50%;
  background:#FFF; color:#111; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent;
  box-shadow:0 4px 16px rgba(0,0,0,0.2);
}
.play-btn svg { width:24px; height:24px; }

/* 音量 */
.volume-area {
  display:flex; align-items:center; gap:8px;
  padding:2px 28px 6px; flex-shrink:0;
}
.vol-btn {
  background:none; border:none; cursor:pointer;
  color:rgba(255,255,255,0.55);
  display:flex; padding:4px; -webkit-tap-highlight-color:transparent;
}
.vol-btn svg { width:17px; height:17px; }
.vol-track { flex:1; height:16px; display:flex; align-items:center; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.vol-bg { width:100%; height:3px; background:rgba(255,255,255,0.2); border-radius:2px; position:relative; }
.vol-fill { height:100%; background:rgba(255,255,255,0.55); border-radius:2px; width:80%; }

/* 播放列表 */
.list-panel {
  flex:1; overflow-y:auto;
  border-top:1px solid rgba(255,255,255,0.08);
  min-height:0; -webkit-overflow-scrolling:touch;
}
.list-panel::-webkit-scrollbar { display:none; }
.list-item {
  display:flex; align-items:center; padding:10px 20px;
  cursor:pointer; border-bottom:1px solid rgba(255,255,255,0.06);
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none; gap:12px;
}
.list-item:active { background:rgba(255,255,255,0.07); }
.list-item.active { background:rgba(255,255,255,0.09); }
.list-item-cover {
  width:40px; height:40px; border-radius:6px; overflow:hidden;
  flex-shrink:0; background:rgba(255,255,255,0.08);
}
.list-item-cover img { width:100%; height:100%; object-fit:cover; display:block; }
.list-item-cover-placeholder {
  width:40px; height:40px; border-radius:6px;
  background:rgba(255,255,255,0.06); flex-shrink:0;
}
.list-item-info { flex:1; min-width:0; }
.list-item-title {
  font-size:14px; color:rgba(255,255,255,0.9);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.list-item.active .list-item-title { color:#fff; font-weight:500; }
.list-item-artist {
  font-size:11px; color:rgba(255,255,255,0.42); margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.list-item-right { flex-shrink:0; display:flex; align-items:center; }
.eq-bars { display:none; align-items:flex-end; gap:2px; height:14px; }
.list-item.active .eq-bars { display:flex; }
.eq-bar {
  width:3px; background:#FFF; border-radius:1px;
  animation:eq 0.8s ease-in-out infinite alternate;
}
.eq-bar:nth-child(1) { height:6px; animation-delay:0s; }
.eq-bar:nth-child(2) { height:10px; animation-delay:0.2s; }
.eq-bar:nth-child(3) { height:4px; animation-delay:0.4s; }
.eq-bar:nth-child(4) { height:8px; animation-delay:0.1s; }
@keyframes eq { 0% { height:4px; } 100% { height:14px; } }

/* 底部迷你条 */
.mini-player {
  flex-shrink:0; display:flex; align-items:center;
  padding:10px 16px; border-top:1px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.07); cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none; gap:12px;
}
.mini-cover {
  width:40px; height:40px; border-radius:6px; overflow:hidden;
  flex-shrink:0; background:rgba(255,255,255,0.08);
}
.mini-cover img { width:100%; height:100%; object-fit:cover; display:block; }
.mini-info { flex:1; min-width:0; }
.mini-title {
  font-size:13px; font-weight:500; color:#FFF;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.mini-artist { font-size:11px; color:rgba(255,255,255,0.48); margin-top:1px; }
.mini-play-btn {
  background:none; border:none; cursor:pointer; color:#FFF;
  display:flex; padding:6px; -webkit-tap-highlight-color:transparent;
}
.mini-play-btn svg { width:22px; height:22px; }

@media (max-width:480px) {
  .pl-header-title { font-size:26px; }
  .pl-grid { padding:0 16px 80px; gap:24px; }
  .cover-circle, .cover-circle-placeholder { width:190px; height:190px; }
  .progress-area { padding:14px 24px 4px; }
  .controls { padding:6px 24px 4px; gap:32px; }
  .volume-area { padding:2px 24px 6px; }
}
</style>
</head>
<body>

<div id="playlist-view">
  <div class="pl-header">
    <div class="pl-header-title">野菩萨</div>
    <div class="pl-header-subtitle">墨染剧本杀</div>
  </div>
  <div class="pl-grid" id="playlist-grid"></div>
</div>

<div id="player-view">
  <div class="pl-bg" id="pl-bg"></div>
  <div class="pv-body">
    <div class="player-header">
      <button class="back-btn" id="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div class="player-header-title" id="player-header-title">歌单</div>
    </div>

    <div class="cover-area" id="cover-area">
      <div class="cover-circle-placeholder" id="cover-placeholder"><span>暂无封面</span></div>
      <div class="cover-circle" id="cover-circle" style="display:none">
        <img id="cover-img" src="" alt="">
        <div class="cover-overlay">
          <div class="cover-song-title" id="cover-song-title">未选择歌曲</div>
          <div class="cover-song-artist" id="cover-song-artist"></div>
        </div>
      </div>
    </div>

    <div class="progress-area">
      <div class="progress-track" id="progress-track">
        <div class="progress-bg"><div class="progress-fill" id="progress-fill"><div class="progress-dot"></div></div></div>
      </div>
      <div class="time-row">
        <span id="current-time">0:00</span><span id="total-time">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="prev-btn"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="19,5 12,5 12,1 2,8 12,15 12,11 19,11"></polygon></svg></button>
      <button class="play-btn" id="play-btn"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 20,12 8,19"></polygon></svg></button>
      <button class="ctrl-btn" id="next-btn"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,5 12,5 12,1 22,8 12,15 12,11 5,11"></polygon></svg></button>
    </div>

    <div class="volume-area">
      <button class="vol-btn" id="vol-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="vol-icon">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
      </button>
      <div class="vol-track" id="vol-track"><div class="vol-bg"><div class="vol-fill" id="vol-fill"></div></div></div>
    </div>

    <div class="list-panel" id="list-panel"></div>

    <div class="mini-player" id="mini-player">
      <div class="mini-cover" id="mini-cover-el"><img id="mini-cover-img" src="" alt="" style="display:none"></div>
      <div class="mini-info">
        <div class="mini-title" id="mini-title">未播放</div>
        <div class="mini-artist" id="mini-artist"></div>
      </div>
      <button class="mini-play-btn" id="mini-play-btn">
        <svg viewBox="0 0 24 24" fill="currentColor" id="mini-play-icon"><polygon points="8,5 20,12 8,19"></polygon></svg>
      </button>
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script>
const $ = id => document.getElementById(id);
const audio = $('audio');
const playlistView = $('playlist-view');
const playerView = $('player-view');

let currentPlIdx = -1, currentIdx = -1, isPlaying = false;
let isDraggingProgress = false, isDraggingVol = false, isMuted = false, lastVol = 0.8;

const playlists = [
  { name:'美梦', cover:'./美梦.jpg', songs:[
    {title:'梦醒时分', artist:'', url:'./梦醒时分.mp3'},
    {title:'送往繁星', artist:'', url:'./送往繁星.mp3'},
  ]},
  {name:'盛夏', cover:'./盛夏.jpg', songs:[]},
  {name:'银屏', cover:'./银屏.jpg', songs:[]},
  {name:'生吞', cover:'./生吞.jpg', songs:[]},
  {name:'钉子', cover:'./钉子.jpg', songs:[]},
  {name:'远望', cover:'./远望.jpg', songs:[]},
  {name:'归乡', cover:'./归乡.jpg', songs:[]},
  {name:'空屋', cover:'./空屋.jpg', songs:[]},
];

function renderPlaylists() {
  const g = $('playlist-grid');
  g.innerHTML = '';
  playlists.forEach((p, i) => {
    const c = document.createElement('div');
    c.className = 'pl-card';
    c.innerHTML = `<img src="${p.cover}" alt="${p.name}">`;
    c.addEventListener('click', () => openPlaylist(i));
    g.appendChild(c);
  });
}

function openPlaylist(idx) {
  currentPlIdx = idx; currentIdx = -1;
  audio.pause(); isPlaying = false; updatePlayBtn();
  const pl = playlists[idx];
  $('player-header-title').textContent = pl.name;
  $('pl-bg').style.backgroundImage = `url(${pl.cover})`;
  if (pl.cover) {
    $('cover-img').src = pl.cover;
    $('cover-circle').style.display = '';
    $('cover-placeholder').style.display = 'none';
    $('mini-cover-img').src = pl.cover;
    $('mini-cover-img').style.display = '';
  } else {
    $('cover-circle').style.display = 'none';
    $('cover-placeholder').style.display = '';
    $('mini-cover-img').style.display = 'none';
  }
  $('cover-song-title').textContent = pl.songs.length > 0 ? pl.songs[0].title : '暂无歌曲';
  $('cover-song-artist').textContent = '';
  playlistView.style.display = 'none';
  playerView.classList.add('show');
  renderListPanel();
  if (pl.songs.length > 0) { loadSong(0); }
  else {
    $('progress-fill').style.width = '0%';
    $('current-time').textContent = '0:00';
    $('total-time').textContent = '0:00';
    $('list-panel').innerHTML = '<div style="padding:32px;text-align:center;color:rgba(255,255,255,0.35);font-size:14px">暂无歌曲</div>';
  }
}

function showPlaylists() {
  audio.pause(); isPlaying = false; updatePlayBtn();
  playerView.classList.remove('show');
  playlistView.style.display = 'flex';
}

function loadSong(idx) {
  const pl = playlists[currentPlIdx];
  if (idx < 0 || idx >= pl.songs.length) return;
  currentIdx = idx;
  const s = pl.songs[idx];
  audio.src = s.url; audio.load();
  $('cover-song-title').textContent = s.title;
  $('cover-song-artist').textContent = s.artist || '';
  renderListPanel();
  if (isPlaying) audio.play().catch(() => {});
}

function togglePlay() {
  if (currentIdx < 0 && playlists[currentPlIdx].songs.length > 0) { loadSong(0); }
  if (audio.src) { isPlaying ? audio.pause() : audio.play().catch(() => {}); }
}
function playPrev() {
  const p = playlists[currentPlIdx]; if (!p.songs.length) return;
  let i = currentIdx - 1; if (i < 0) i = p.songs.length - 1;
  loadSong(i); if (!isPlaying) togglePlay();
}
function playNext() {
  const p = playlists[currentPlIdx]; if (!p.songs.length) return;
  let i = currentIdx + 1; if (i >= p.songs.length) i = 0;
  loadSong(i); if (!isPlaying) togglePlay();
}

function updatePlayBtn() {
  const playSVG = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 20,12 8,19"></polygon></svg>';
  const pauseSVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3" height="14" rx="1"></rect><rect x="14" y="5" width="3" height="14" rx="1"></rect></svg>';
  $('play-btn').innerHTML = isPlaying ? pauseSVG : playSVG;
  $('mini-play-btn').innerHTML = isPlaying ? pauseSVG : playSVG;
  $('mini-title').textContent = currentIdx >= 0 ? playlists[currentPlIdx].songs[currentIdx].title : '未播放';
  $('mini-artist').textContent = currentIdx >= 0 ? (playlists[currentPlIdx].songs[currentIdx].artist || '') : '';
  if (isPlaying) $('cover-circle').classList.add('spinning');
  else $('cover-circle').classList.remove('spinning');
}

function formatTime(s) {
  if (!s || isNaN(s)) return '0:00';
  return Math.floor(s/60) + ':' + ((Math.floor(s%60) < 10 ? '0' : '') + Math.floor(s%60));
}
function setProgressPct(pct) {
  pct = Math.max(0, Math.min(1, pct));
  $('progress-fill').style.width = (pct * 100) + '%';
  if (audio.duration) $('current-time').textContent = formatTime(pct * audio.duration);
}
function seekToPct(pct) {
  pct = Math.max(0, Math.min(1, pct));
  if (audio.duration) audio.currentTime = pct * audio.duration;
  setProgressPct(pct);
}

audio.addEventListener('loadedmetadata', () => {
  if (!isDraggingProgress) $('total-time').textContent = formatTime(audio.duration);
});
audio.addEventListener('timeupdate', () => {
  if (!isDraggingProgress && audio.duration) setProgressPct(audio.currentTime / audio.duration);
});
audio.addEventListener('ended', () => { audio.currentTime = 0; audio.play().catch(() => {}); });

// 进度条拖拽
const progTrack = $('progress-track');
function onPD(e) {
  e.preventDefault(); isDraggingProgress = true; onPM(e);
  document.addEventListener('mousemove', onPM);
  document.addEventListener('mouseup', onPU);
  document.addEventListener('touchmove', onPM, {passive:false});
  document.addEventListener('touchend', onPU);
  progTrack.classList.add('dragging');
}
function onPM(e) {
  const r = progTrack.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  seekToPct(x / r.width);
}
function onPU(e) {
  if (isDraggingProgress) {
    const r = progTrack.getBoundingClientRect();
    const cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
    seekToPct((cx - r.left) / r.width);
  }
  isDraggingProgress = false;
  document.removeEventListener('mousemove', onPM);
  document.removeEventListener('mouseup', onPU);
  document.removeEventListener('touchmove', onPM);
  document.removeEventListener('touchend', onPU);
  progTrack.classList.remove('dragging');
}
progTrack.addEventListener('mousedown', onPD);
progTrack.addEventListener('touchstart', onPD, {passive:false});

// 音量
function setVolPct(pct) {
  pct = Math.max(0, Math.min(1, pct));
  audio.volume = pct;
  $('vol-fill').style.width = (pct * 100) + '%';
  isMuted = pct === 0;
  updateVolIcon();
}
const volTrack = $('vol-track');
function onVD(e) {
  e.preventDefault(); isDraggingVol = true; onVM(e);
  document.addEventListener('mousemove', onVM);
  document.addEventListener('mouseup', onVU);
  document.addEventListener('touchmove', onVM, {passive:false});
  document.addEventListener('touchend', onVU);
}
function onVM(e) {
  const r = volTrack.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  setVolPct(x / r.width);
}
function onVU() {
  isDraggingVol = false;
  document.removeEventListener('mousemove', onVM);
  document.removeEventListener('mouseup', onVU);
  document.removeEventListener('touchmove', onVM);
  document.removeEventListener('touchend', onVU);
}
volTrack.addEventListener('mousedown', onVD);
volTrack.addEventListener('touchstart', onVD, {passive:false});

function toggleMute() {
  if (isMuted) {
    audio.volume = lastVol || 0.8;
    $('vol-fill').style.width = ((lastVol || 0.8) * 100) + '%';
    isMuted = false;
  } else {
    lastVol = audio.volume;
    audio.volume = 0;
    $('vol-fill').style.width = '0%';
    isMuted = true;
  }
  updateVolIcon();
}
function updateVolIcon() {
  const mS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>';
  const vS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>';
  $('vol-btn').innerHTML = (isMuted || audio.volume === 0) ? mS : vS;
}

// 渲染播放列表面板
function renderListPanel() {
  const panel = $('list-panel');
  const pl = playlists[currentPlIdx];
  if (pl.songs.length === 0) { panel.innerHTML = ''; return; }
  panel.innerHTML = '';
  pl.songs.forEach((s, i) => {
    const item = document.createElement('div');
    item.className = 'list-item' + (i === currentIdx ? ' active' : '');
    item.addEventListener('click', () => { loadSong(i); if (!isPlaying) togglePlay(); });
    const ch = pl.cover
      ? '<div class="list-item-cover"><img src="' + pl.cover + '" alt=""></div>'
      : '<div class="list-item-cover-placeholder"></div>';
    const eqH = (i === currentIdx && isPlaying)
      ? '<div class="eq-bars" style="display:flex"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div>'
      : '<span style="color:rgba(255,255,255,0.3);font-size:13px;font-variant-numeric:tabular-nums">' + (i+1) + '</span>';
    item.innerHTML = ch + '<div class="list-item-info"><div class="list-item-title">' + s.title + '</div><div class="list-item-artist">' + (s.artist||'') + '</div></div><div class="list-item-right">' + eqH + '</div>';
    panel.appendChild(item);
  });
}

// Media Session
function updateMediaSession() {
  if (!('mediaSession' in navigator) || currentIdx < 0) return;
  const s = playlists[currentPlIdx].songs[currentIdx];
  navigator.mediaSession.metadata = new MediaMetadata({
    title: s.title, artist: s.artist || '', album: playlists[currentPlIdx].name,
  });
  navigator.mediaSession.setActionHandler('play', () => { if (!isPlaying) togglePlay(); });
  navigator.mediaSession.setActionHandler('pause', () => { if (isPlaying) togglePlay(); });
  navigator.mediaSession.setActionHandler('previoustrack', null);
  navigator.mediaSession.setActionHandler('nexttrack', null);
}
audio.addEventListener('play', () => { isPlaying = true; updatePlayBtn(); updateMediaSession(); });
audio.addEventListener('pause', () => { isPlaying = false; updatePlayBtn(); });

// 按钮绑定
$('back-btn').addEventListener('click', showPlaylists);
$('play-btn').addEventListener('click', togglePlay);
$('prev-btn').addEventListener('click', playPrev);
$('next-btn').addEventListener('click', playNext);
$('mini-player').addEventListener('click', (e) => {
  if (e.target.closest('.mini-play-btn')) return;
  togglePlay();
});
$('mini-play-btn').addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
$('vol-btn').addEventListener('click', toggleMute);

// 初始化
renderPlaylists();
audio.volume = 0.8;
</script>
</body>
</html>
